<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Финансовый Геймер - интерактивная игра по финансовой грамотности для школ Казахстана">
    
    <title>Финансовый Геймер - Школа</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="src/styles/main_new.css">
    
    <script>
      // Конфигурация API
      window.API_URL = window.location.hostname === 'localhost' 
        ? 'http://localhost:5000/api' 
        : '/api';
    </script>
</head>
<body>
    <div id="app"></div>
    
    <script>
        // Регистрация Service Worker для PWA функционала
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('src/service-worker.js')
                .then(reg => console.log('✅ Service Worker зарегистрирован'))
                .catch(err => console.log('❌ Service Worker ошибка:', err));
        }
    </script>
    
    <script src="src/api/client.js"></script>
    <script src="src/game/levels_new.js"></script>
    <script src="src/game/game.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
